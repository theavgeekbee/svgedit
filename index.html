<!DOCTYPE html>
<html lang="en">
    <head>

        <title>SVG Editor</title>
        <link href="style.css" rel="stylesheet">

        <script src="index.js" defer></script>
    </head>

        <div class="left">
            <textarea id="svg-edit" class="code-textbox" spellcheck="false" autocapitalize="false">

        </div>
        <div id="display-area" class="right">
        </div>
    </body>
</html>
